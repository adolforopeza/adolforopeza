name: Actualizar Insignias de Lenguajes
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular porcentajes y actualizar README
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 -c '
          import os
          import json
          import urllib.request

          token = os.environ.get("GH_TOKEN")
          headers = {"Authorization": f"Bearer {token}", "User-Agent": "GitHub-Action"}

          repos = []
          page = 1
          while page <= 3:
              req = urllib.request.Request(f"https://api.github.com/user/repos?visibility=all&per_page=100&page={page}", headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      if not data:
                          break
                      repos.extend(data)
                      if len(data) < 100:
                          break
              except Exception:
                  break
              page += 1

          langs = {}
          for repo in repos:
              if not repo.get("fork", False):
                  lang_url = repo.get("languages_url")
                  if lang_url:
                      lang_req = urllib.request.Request(lang_url, headers=headers)
                      try:
                          with urllib.request.urlopen(lang_req) as lang_res:
                              lang_data = json.loads(lang_res.read().decode())
                              for lang, bytes_count in lang_data.items():
                                  langs[lang] = langs.get(lang, 0) + bytes_count
                      except Exception:
                          pass

          total = sum(langs.values())

          def get_pct(name):
              if total <= 0:
                  return "0.00%"
              b = langs.get(name, 0)
              return f"{(b / total) * 100:.2f}%"

          p_php = get_pct("PHP")
          p_html = get_pct("HTML")
          p_css = get_pct("CSS")
          p_mysql = get_pct("SQL")
          p_js = get_pct("JavaScript")
          p_git = get_pct("Shell")
          p_linux = get_pct("Dockerfile")
          p_magento = p_php

          badges_content = "![PHP](https://img.shields.io/badge/PHP-" + p_php + "-777BB4?style=for-the-badge&logo=php&logoColor=white)\n" + \
                           "![Magento](https://img.shields.io/badge/Magento-" + p_magento + "-E76F00?style=for-the-badge&logo=magento&logoColor=white)\n" + \
                           "![HTML5](https://img.shields.io/badge/HTML5-" + p_html + "-E34F26?style=for-the-badge&logo=html5&logoColor=white)\n" + \
                           "![CSS3](https://img.shields.io/badge/CSS3-" + p_css + "-1572B6?style=for-the-badge&logo=css3&logoColor=white)\n" + \
                           "![MySQL](https://img.shields.io/badge/MySQL-" + p_mysql + "-4479A1?style=for-the-badge&logo=mysql&logoColor=white)\n" + \
                           "![JavaScript](https://img.shields.io/badge/JavaScript-" + p_js + "-F7DF1E?style=for-the-badge&logo=javascript&logoColor=black)\n" + \
                           "![Git](https://img.shields.io/badge/Git-F05032?style=for-the-badge&logo=git&logoColor=white)\n" + \
                           "![Linux](https://img.shields.io/badge/Linux-FCC624?style=for-the-badge&logo=linux&logoColor=black)"

          if os.path.exists("README.md"):
              with open("README.md", "r", encoding="utf-8") as f:
                  content = f.read()
          else:
              content = ""

          start_marker = "<!--START_SECTION:langs-->"
          end_marker = "<!--END_SECTION:langs-->"

          if start_marker in content and end_marker in content:
              parts = content.split(start_marker)
              pre = parts[0]
              post = parts[1].split(end_marker)[1]
              new_content = pre + start_marker + "\n" + badges_content + "\n" + end_marker + post
          else:
              new_content = content + f"\n\n{start_marker}\n{badges_content}\n{end_marker}\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          '

      - name: Limpiar archivo de imagen obsoleto si existe
        run: rm -f languages_card.png

      - name: Commit y Push de cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm --ignore-unmatch languages_card.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: actualizar insignias con porcentajes reales" && git push)
