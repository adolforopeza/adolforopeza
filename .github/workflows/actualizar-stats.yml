name: Actualizar lenguajes privados

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular e inyectar porcentajes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 -c '
          import os, json, urllib.request
          token = os.environ.get("GH_TOKEN")
          headers = {"Authorization": f"Bearer {token}", "User-Agent": "GitHub-Action"}
          
          req = urllib.request.Request("https://api.github.com/user/repos?visibility=private&per_page=100", headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  repos = json.loads(response.read().decode())
          except Exception as e:
              repos = []

          langs = {}
          for repo in repos:
              if not repo.get("fork", False):
                  lang_url = repo.get("languages_url")
                  if lang_url:
                      lang_req = urllib.request.Request(lang_url, headers=headers)
                      try:
                          with urllib.request.urlopen(lang_req) as lang_res:
                              lang_data = json.loads(lang_res.read().decode())
                              for lang, bytes_count in lang_data.items():
                                  langs[lang] = langs.get(lang, 0) + bytes_count
                      except Exception:
                          pass
                              
          total = sum(langs.values())
          if total > 0:
              stats_md = "### 📊 Estadísticas de Lenguajes (Privados + Públicos)\n\n"
              for lang, b in sorted(langs.items(), key=lambda x: x[1], reverse=True):
                  pct = (b / total) * 100
                  stats_md += f"- **{lang}**: {pct:.2f}%\n"
              
              # Leer README actual
              if os.path.exists("README.md"):
                  with open("README.md", "r", encoding="utf-8") as f:
                      content = f.read()
              else:
                  content = ""
              
              start_marker = "<!--START_SECTION:langs-->"
              end_marker = "<!--END_SECTION:langs-->"
              
              if start_marker in content and end_marker in content:
                  parts = content.split(start_marker)
                  pre = parts[0]
                  post = parts[1].split(end_marker)[1]
                  new_content = pre + start_marker + "\n" + stats_md + "\n" + end_marker + post
              else:
                  new_content = content + f"\n\n{start_marker}\n{stats_md}\n{end_marker}\n"
                  
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(new_content)
          '

      - name: Configurar Git y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: actualizar estadísticas de lenguajes privados" && git push)
