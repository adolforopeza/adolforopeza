name: Actualizar lenguajes privados

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta automáticamente una vez al día
  workflow_dispatch: # Permite ejecutarlo manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Calcular bytes de lenguajes
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python3 -c '
          import os, json, urllib.request
          token = os.environ.get("GH_TOKEN")
          headers = {"Authorization": f"Bearer {token}", "User-Agent": "GitHub-Action"}
          
          req = urllib.request.Request("https://api.github.com/user/repos?visibility=private&per_page=100", headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  repos = json.loads(response.read().decode())
          except Exception as e:
              repos = []
              print(f"Error al listar repositorios: {e}")

          langs = {}
          for repo in repos:
              if not repo.get("fork", False):
                  lang_url = repo.get("languages_url")
                  if lang_url:
                      lang_req = urllib.request.Request(lang_url, headers=headers)
                      try:
                          with urllib.request.urlopen(lang_req) as lang_res:
                              lang_data = json.loads(lang_res.read().decode())
                              for lang, bytes_count in lang_data.items():
                                  langs[lang] = langs.get(lang, 0) + bytes_count
                      except Exception:
                          pass
                              
          total = sum(langs.values())
          if total > 0:
              print("--- PORCENTAJES REALES ---")
              for lang, b in sorted(langs.items(), key=lambda x: x[1], reverse=True):
                  pct = (b / total) * 100
                  print(f"{lang}: {pct:.2f}%")
          else:
              print("No se encontraron lenguajes o repositorios accesibles.")
          '
