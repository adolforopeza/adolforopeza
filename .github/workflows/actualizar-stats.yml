name: Actualizar Estadisticas de Lenguajes
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de calculo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USER: "adolforopeza"
        run: python .github/scripts/update_stats.py

      - name: Commit y Push cambios si existen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar estadisticas de lenguajes" && git push)
