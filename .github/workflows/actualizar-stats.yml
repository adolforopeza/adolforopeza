name: Actualizar Estadísticas de Lenguajes
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de imagen
        run: pip install Pillow

      - name: Crear script generador
        run: |
          cat << 'EOF' > generate_card.py
          import os
          import json
          import urllib.request
          from PIL import Image, ImageDraw, ImageFont

          token = os.environ.get("GH_TOKEN")
          headers = {"Authorization": f"Bearer {token}", "User-Agent": "GitHub-Action"}

          # Paginación para obtener todos los repositorios privados y públicos (hasta 300)
          repos = []
          page = 1
          while page <= 3:
              req = urllib.request.Request(f"https://api.github.com/user/repos?visibility=all&per_page=100&page={page}", headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      data = json.loads(response.read().decode())
                      if not data:
                          break
                      repos.extend(data)
                      if len(data) < 100:
                          break
              except Exception:
                  break
              page += 1

          langs = {}
          for repo in repos:
              if not repo.get("fork", False):
                  lang_url = repo.get("languages_url")
                  if lang_url:
                      lang_req = urllib.request.Request(lang_url, headers=headers)
                      try:
                          with urllib.request.urlopen(lang_req) as lang_res:
                              lang_data = json.loads(lang_res.read().decode())
                              for lang, bytes_count in lang_data.items():
                                  langs[lang] = langs.get(lang, 0) + bytes_count
                      except Exception:
                          pass

          total = sum(langs.values())
          if total <= 0:
              exit(0)

          sorted_langs = sorted(langs.items(), key=lambda x: x[1], reverse=True)

          colors = {
              "PHP": (79, 93, 149), "SQL": (224, 144, 56), "CSS": (86, 61, 124),
              "JavaScript": (241, 224, 90), "HTML": (227, 76, 38), "GDScript": (53, 114, 165),
              "Shell": (137, 224, 81), "Less": (204, 204, 204), "Python": (53, 114, 165),
              "TypeScript": (49, 120, 198), "Vue": (65, 184, 131), "SCSS": (199, 125, 162)
          }
          default_color = (150, 150, 150)

          filtered_langs = []
          for lang, b in sorted_langs:
              pct = (b / total) * 100
              if pct >= 0.1:
                  filtered_langs.append((lang, b, pct))

          width, height = 550, 60 + (len(filtered_langs) * 36) + 20
          img = Image.new("RGBA", (width, height), (13, 17, 23, 255))
          draw = ImageDraw.Draw(img)

          try:
              font_title = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 14)
              font_text = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 12)
          except Exception:
              font_title = font_text = ImageFont.load_default()

          draw.text((20, 20), "Most Used Languages (Privados + Públicos)", fill=(201, 209, 217), font=font_title)

          y_offset = 60
          for lang, b, pct in filtered_langs:
              color = colors.get(lang, default_color)

              draw.text((20, y_offset), lang, fill=(201, 209, 217), font=font_text)
              draw.text((475, y_offset), f"{pct:.2f}%", fill=(139, 148, 158), font=font_text)

              bar_y = y_offset + 18
              draw.rounded_rectangle([20, bar_y, 525, bar_y + 8], radius=4, fill=(48, 54, 61))
              fill_width = int(505 * (pct / 100))
              if fill_width > 0:
                  draw.rounded_rectangle([20, bar_y, 20 + fill_width, bar_y + 8], radius=4, fill=color)

              y_offset += 36

          img.save("languages_card.png", "PNG")
          EOF

      - name: Ejecutar script generador
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 generate_card.py

      - name: Actualizar README.md
        run: |
          python3 -c '
          import os
          card_md = "<p align=\"center\">\n  <img src=\"languages_card.png\" alt=\"Most Used Languages\">\n</p>"
          if os.path.exists("README.md"):
              with open("README.md", "r", encoding="utf-8") as f:
                  content = f.read()
          else:
              content = ""

          start_marker = "<!--START_SECTION:langs-->"
          end_marker = "<!--END_SECTION:langs-->"

          if start_marker in content and end_marker in content:
              parts = content.split(start_marker)
              pre = parts[0]
              post = parts[1].split(end_marker)[1]
              new_content = pre + start_marker + "\n" + card_md + "\n" + end_marker + post
          else:
              new_content = content + f"\n\n{start_marker}\n{card_md}\n{end_marker}\n"

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_content)
          '

      - name: Commit y Push de cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md languages_card.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: actualizar imagen con paginacion y todos los repos" && git push)
